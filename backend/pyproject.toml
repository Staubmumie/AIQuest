[project]
name = "aiquest-backend"
version = "0.1.0"
description = "AIQuest backend: LangGraph Game Master behind a small FastAPI layer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "lancedb>=0.13",
    "langchain-openai>=0.3",
    "langfuse>=5.0.4",
    "langgraph>=0.4",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
